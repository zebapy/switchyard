[package]
name = "switchyard"
version = "0.3.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
git2 = "0.19"
# git2 -> libgit2-sys pulls openssl-sys. Vendored builds OpenSSL from source so
# it cross-compiles (no system sysroot/pkg-config needed) — required to build the
# x86_64 slice of the universal macOS binary on an arm64 runner.
openssl-sys = { version = "0.9", features = ["vendored"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tiny_http = "0.12"
sha2 = "0.10"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
toml = "0.8"
ignore = "0.4"

